name: probebug07
services:
  app:
    build: ./backend
    container_name: cc-probe-lab-probe-bug-07
    ports: ["8310:8100"]
    volumes:
      - probe_data:/data
      - ./fixtures:/fixtures:ro
    environment:
      数据目录: /data
      夹具目录: /fixtures
      端口: "8247"
volumes:
  probe_data:
